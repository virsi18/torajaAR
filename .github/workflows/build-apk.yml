name: Build Android APK (AR Toraja)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔍 Cek Lingkungan Flutter
        run: flutter doctor -v

      - name: 📦 Ambil Dependensi
        run: flutter pub get

      - name: 🔨 Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: 🔨 Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: 📤 Upload File APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AR-Toraja-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
